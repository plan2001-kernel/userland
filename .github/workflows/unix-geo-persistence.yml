name: Unix GE/O persistence (real kernel / same-disk cold reboot)

on:
  pull_request:
    paths:
      - '.github/workflows/busybox-f5.yml'
      - 'config/sources.json'
      - 'ports/busybox/**'
      - 'ports/unix/**'
      - 'tests/host/**'
      - 'tools/ci/**'
      - 'docs/BUSYBOX-F5.md'
      - 'docs/UNIX-PVD.md'
      - 'docs/UNIX-INIT.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/busybox-f5.yml'
      - 'config/sources.json'
      - 'ports/busybox/**'
      - 'ports/unix/**'
      - 'tests/host/**'
      - 'tools/ci/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unix-geo-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-f5-console:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Test live kernel-main source resolution policy
        run: python3 -m unittest discover -s tools/ci -p 'test_fetch_sources.py' -v

      - name: Install native build tools and real VGA/QEMU acceptance dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc-14 binutils clang lld file mtools ovmf \
            qemu-system-x86 python3 python3-pil

      - name: Host PVD and unix-init handoff/restart tests (ASan/UBSan)
        run: |
          bash tools/ci/test_pvd.sh
          python3 -m unittest discover -s tools/ci -p "test_seed_unix_manifest.py" -v

      - name: Resolve latest kernel main once, and verify BusyBox source SHA
        run: |
          python3 tools/ci/fetch_sources.py \
            --lock config/sources.json \
            --dest "${{ runner.temp }}/plan2001-sources" \
            --reports "${{ runner.temp }}/plan2001-reports"

      - name: Build native kernel, UEFI loader, MicroPython libc and O tools
        env:
          CC: gcc-14
        working-directory: ${{ runner.temp }}/plan2001-sources/kernel
        run: |
          tools/build-gcc.sh --kernel -j 4
          tools/build-efi-gcc.sh -j 4
          tools/build-mpy-gcc.sh -j 4
          tools/build.sh

      - name: Link native Unix supervisor, separate Unix init child, and BusyBox applets
        run: |
          python3 tools/ci/build_busybox_target.py \
            --kernel "${{ runner.temp }}/plan2001-sources/kernel" \
            --busybox "${{ runner.temp }}/plan2001-sources/busybox" \
            --reports "${{ runner.temp }}/plan2001-reports" --cc gcc-14

      - name: Seed disposable GE/O with supervisor and independent Unix child ELFs
        run: |
          python3 tools/ci/seed_busybox_spawn.py \
            --unix-manifest \
            --kernel "${{ runner.temp }}/plan2001-sources/kernel" \
            --elf "${{ runner.temp }}/plan2001-reports/busybox-target/unix-supervisor-f5-plan2001.elf" \
            --extra-elf "${{ runner.temp }}/plan2001-reports/busybox-target/unix-init-f5-plan2001.elf" \
            --init tests/guest/busybox_spawn_init.py \
            --image "${{ runner.temp }}/plan2001-reports/busybox-f5-o.img" \
            --reports "${{ runner.temp }}/plan2001-reports"

      - name: Verify delegated GE/O persistence across two real QEMU cold boots
        env:
          UX_GEO_PERSIST: "1"
        run: |
          bash tools/ci/guest_busybox_f5.sh \
            "${{ runner.temp }}/plan2001-sources/kernel" \
            "${{ runner.temp }}/plan2001-reports/busybox-f5-o.img" \
            "${{ runner.temp }}/plan2001-reports"

      - name: Summarize source revisions and test results
        if: always()
        shell: bash
        run: |
          for report in SUMMARY.md busybox-target-build.md busybox-f5-guest.md; do
            if [ -f "${{ runner.temp }}/plan2001-reports/$report" ]; then
              cat "${{ runner.temp }}/plan2001-reports/$report" >> "$GITHUB_STEP_SUMMARY"
            else
              printf '\n**NOT COMPLETED:** %s\n' "$report" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          echo 'QEMU F5: supervisor boots as manifest process, delegates six stream regions and restricted Vexecute to an independent Unix child.' >> "$GITHUB_STEP_SUMMARY"
          echo 'PASS only if guest script verifies same GE/O disk across boots. NOT RUN: BusyBox ash/sh, full POSIX tty, hardware.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload native F5 guest proof (no disk images)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unix-geo-persistent-two-boots-qemu
          path: |
            ${{ runner.temp }}/plan2001-reports/*.md
            ${{ runner.temp }}/plan2001-reports/*.json
            ${{ runner.temp }}/plan2001-reports/*.log
            ${{ runner.temp }}/plan2001-reports/qemu-busybox-f5/*.log
            ${{ runner.temp }}/plan2001-reports/qemu-busybox-f5/screens/**/*.txt
            ${{ runner.temp }}/plan2001-reports/qemu-busybox-f5/screens/**/*.ppm
          if-no-files-found: warn
          retention-days: 14

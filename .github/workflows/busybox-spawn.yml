name: MicroPython spawns native BusyBox child in Plan2001 QEMU

on:
  pull_request:
    paths:
      - '.github/workflows/busybox-spawn.yml'
      - 'config/sources.json'
      - 'ports/busybox/**'
      - 'tests/guest/busybox_spawn_init.py'
      - 'tools/ci/build_busybox_target.py'
      - 'tools/ci/seed_busybox_spawn.py'
      - 'tools/ci/guest_busybox_spawn.sh'
      - 'docs/BUSYBOX-SPAWN.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/busybox-spawn.yml'
      - 'config/sources.json'
      - 'ports/busybox/**'
      - 'tests/guest/busybox_spawn_init.py'
      - 'tools/ci/build_busybox_target.py'
      - 'tools/ci/seed_busybox_spawn.py'
      - 'tools/ci/guest_busybox_spawn.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-busybox-spawn-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  micropython-busybox-child:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Check out Plan2001 userland
        uses: actions/checkout@v4

      - name: Install native build, QEMU and OVMF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc-14 binutils clang lld file mtools ovmf \
            qemu-system-x86 python3

      - name: Fetch exact kernel and BusyBox source pins
        run: |
          python3 tools/ci/fetch_sources.py \
            --lock config/sources.json \
            --dest "${{ runner.temp }}/plan2001-sources" \
            --reports "${{ runner.temp }}/plan2001-reports"

      - name: Build real kernel and UEFI loader
        env:
          CC: gcc-14
        working-directory: ${{ runner.temp }}/plan2001-sources/kernel
        run: |
          tools/build-gcc.sh --kernel -j 4
          tools/build-efi-gcc.sh -j 4

      - name: Build native MicroPython, libc, and GE/O seeder
        env:
          CC: gcc-14
        working-directory: ${{ runner.temp }}/plan2001-sources/kernel
        run: |
          tools/build-mpy-gcc.sh -j 4
          tools/build.sh

      - name: Build standard BusyBox ELF with native Plan2001 libc
        run: |
          python3 tools/ci/build_busybox_target.py \
            --kernel "${{ runner.temp }}/plan2001-sources/kernel" \
            --busybox "${{ runner.temp }}/plan2001-sources/busybox" \
            --reports "${{ runner.temp }}/plan2001-reports" --cc gcc-14

      - name: Seed separate MicroPython and BusyBox executables in disposable GE/O
        run: |
          python3 tools/ci/seed_busybox_spawn.py \
            --kernel "${{ runner.temp }}/plan2001-sources/kernel" \
            --elf "${{ runner.temp }}/plan2001-reports/busybox-target/busybox-plan2001.elf" \
            --init tests/guest/busybox_spawn_init.py \
            --image "${{ runner.temp }}/plan2001-reports/busybox-spawn-o.img" \
            --reports "${{ runner.temp }}/plan2001-reports"

      - name: Boot MicroPython and SPAWN/wait for normal BusyBox children in QEMU
        run: |
          bash tools/ci/guest_busybox_spawn.sh \
            "${{ runner.temp }}/plan2001-sources/kernel" \
            "${{ runner.temp }}/plan2001-reports/busybox-spawn-o.img" \
            "${{ runner.temp }}/plan2001-reports"

      - name: Publish guest process test summary
        if: always()
        shell: bash
        run: |
          {
            echo '## MicroPython launches BusyBox via SPAWN'
            echo
            if [ -f "${{ runner.temp }}/plan2001-reports/busybox-target-build.md" ]; then
              cat "${{ runner.temp }}/plan2001-reports/busybox-target-build.md"
            else
              echo 'Native BusyBox build: **NOT COMPLETED**.'
            fi
            echo
            if [ -f "${{ runner.temp }}/plan2001-reports/busybox-spawn-guest.md" ]; then
              cat "${{ runner.temp }}/plan2001-reports/busybox-spawn-guest.md"
            else
              echo 'Child-process QEMU test: **NOT COMPLETED**.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload executable and proof logs (not disk images)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: busybox-micropython-spawn-qemu
          path: |
            ${{ runner.temp }}/plan2001-reports/*.md
            ${{ runner.temp }}/plan2001-reports/*.json
            ${{ runner.temp }}/plan2001-reports/*.log
            ${{ runner.temp }}/plan2001-reports/*.txt
            ${{ runner.temp }}/plan2001-reports/qemu-busybox-spawn/*.log
            ${{ runner.temp }}/plan2001-reports/qemu-busybox-spawn/*.json
          if-no-files-found: warn
          retention-days: 14
